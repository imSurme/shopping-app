<!DOCTYPE html>
<html class="light" lang="tr">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <meta name="theme-color" content="#008080"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
    <title>Favorilerim - Modern Shopping App</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#008080",
                        "primary-dark": "#006666",
                        "background-light": "#FFFFFF",
                        "background-dark": "#101922",
                        "card-background-light": "#F8F9FA",
                        "card-background-dark": "#1a242d",
                        "text-light": "#1F2937",
                        "text-dark": "#F9FAFB",
                        "text-muted-light": "#6B7280",
                        "text-muted-dark": "#9CA3AF",
                        "border-light": "#E5E7EB",
                        "border-dark": "#374151",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.75rem",
                        "lg": "1rem",
                        "xl": "1.25rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'soft': '0 2px 15px -3px rgba(0, 0, 0, 0.07), 0 10px 20px -2px rgba(0, 0, 0, 0.04)',
                        'soft-dark': '0 2px 15px -3px rgba(0, 0, 0, 0.3), 0 10px 20px -2px rgba(0, 0, 0, 0.2)',
                    }
                },
            },
        }
    </script>
    
    <style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
        
        body {
            min-height: 100vh;
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }
        
        /* Touch improvements */
        * {
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        
        /* Header button animations */
        .header-button {
            transition: all 0.2s ease-in-out;
        }
        
        .header-button:active {
            transform: scale(0.9);
        }
        
        /* Card animations */
        .order-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .order-card:active {
            transform: scale(0.98);
        }
        
        /* Safe area for mobile devices */
        .bottom-nav {
            position: fixed !important;
            bottom: 0 !important;
            left: 0 !important;
            right: 0 !important;
            width: 100% !important;
            padding-bottom: env(safe-area-inset-bottom, 0px);
            box-sizing: border-box;
        }
        
        .safe-area-top {
            padding-top: env(safe-area-inset-top);
        }
        
        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        /* Empty state animation */
        .empty-icon {
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
    <link rel="stylesheet" href="../../css/desktop.css"/>
</head>

<body class="font-display bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark">
    <div class="app-shell relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden">

        <!-- Header -->
        <header class="sticky top-0 z-20 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-md safe-area-top">
            <div class="flex items-center p-4 pb-2 justify-between">
                <button class="header-button flex size-12 shrink-0 items-center justify-center rounded-full hover:bg-card-background-light dark:hover:bg-card-background-dark transition-colors" onclick="goBack()">
                    <span class="material-symbols-outlined text-2xl text-text-light dark:text-text-dark">arrow_back</span>
                </button>

                <h1 class="text-text-light dark:text-text-dark text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Favorilerim</h1>

                <div class="w-12"></div>
            </div>
        </header>

        <!-- Favorites Grid -->
        <main class="flex-grow px-4 pt-2 pb-24" id="favoritesContent">
            <div id="favoritesGrid" class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5">
                <!-- Favorites will be rendered here -->
            </div>
        </main>

        <!-- Empty State (Hidden by default) -->
        <div id="emptyState" class="hidden flex-grow flex flex-col items-center justify-center text-center p-4 pb-24">
            <span class="material-symbols-outlined text-8xl text-text-muted-light dark:text-text-muted-dark empty-icon mb-6">favorite</span>
            <h2 class="text-2xl font-bold text-text-light dark:text-text-dark mb-2">Favori Ürününüz Yok</h2>
            <p class="text-text-muted-light dark:text-text-muted-dark max-w-xs mb-6">Beğendiğiniz ürünlerdeki kalp ikonuna dokunarak favorilerinize ekleyebilirsiniz.</p>
            <button class="bg-primary text-white font-bold py-3 px-8 rounded-xl" onclick="startShopping()">
                Alışverişe Başla
            </button>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav fixed bottom-0 left-0 right-0 z-20 bg-background-light dark:bg-background-dark border-t border-border-light dark:border-border-dark">
            <div class="flex px-2 py-1">
                <a class="nav-brand text-primary" href="../../index.html">
                    <span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">shopping_bag</span>
                    Modern Shopping
                </a>
                <a class="nav-item flex flex-1 flex-col items-center justify-center gap-1 text-text-muted-light dark:text-text-muted-dark py-2" href="../../index.html">
                    <span class="material-symbols-outlined text-2xl">home</span>
                    <p class="text-xs font-medium">Ana Sayfa</p>
                </a>
                <a class="nav-item flex flex-1 flex-col items-center justify-center gap-1 text-text-muted-light dark:text-text-muted-dark py-2 relative" href="../shopping-cart.html">
                    <span class="relative flex">
                        <span class="material-symbols-outlined text-2xl">shopping_cart</span>
                        <span class="absolute -top-1.5 -right-3 bg-primary text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold cart-badge hidden">0</span>
                    </span>
                    <p class="text-xs font-medium">Sepet</p>
                </a>
                <a class="nav-item flex flex-1 flex-col items-center justify-center gap-1 text-primary py-2" href="user-profile.html">
                    <span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">person</span>
                    <p class="text-primary text-xs font-semibold">Profil</p>
                </a>
            </div>
        </nav>

    </div>

    <!-- Products & Cart Manager -->
    <script src="../../js/products.js"></script>
    <script src="../../js/cart-manager.js"></script>

    <!-- JavaScript -->
    <script>
        function renderFavorites() {
            const favorites = Favorites.get().map(getProductById).filter(Boolean);
            const grid = document.getElementById('favoritesGrid');

            document.getElementById('favoritesContent').classList.toggle('hidden', favorites.length === 0);
            document.getElementById('emptyState').classList.toggle('hidden', favorites.length > 0);

            grid.innerHTML = favorites.map(product => {
                const discount = getDiscountPercent(product);
                return `
                    <article class="order-card group cursor-pointer" data-id="${product.id}">
                        <div class="relative overflow-hidden rounded-xl bg-card-background-light dark:bg-card-background-dark aspect-[3/4] mb-3 shadow-soft">
                            ${discount ? `<span class="absolute top-3 left-3 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full z-10">%${discount}</span>` : ''}
                            <button class="remove-fav absolute top-2 right-2 z-10 flex size-9 items-center justify-center rounded-full bg-white/80 dark:bg-black/40 backdrop-blur-sm" aria-label="Favorilerden çıkar">
                                <span class="material-symbols-outlined text-xl text-red-500" style="font-variation-settings: 'FILL' 1;">favorite</span>
                            </button>
                            <div class="w-full h-full bg-center bg-no-repeat bg-cover" style='background-image: url("${product.image}");'></div>
                        </div>
                        <h3 class="text-text-light dark:text-text-dark text-sm font-semibold leading-tight mb-1">${product.name}</h3>
                        <div class="flex items-center gap-2">
                            <p class="text-primary text-base font-bold">${formatPrice(product.price)}</p>
                            ${discount ? `<p class="text-text-muted-light dark:text-text-muted-dark text-sm line-through">${formatPrice(product.originalPrice)}</p>` : ''}
                        </div>
                    </article>
                `;
            }).join('');
        }

        document.getElementById('favoritesGrid').addEventListener('click', function(e) {
            const card = e.target.closest('[data-id]');
            if (!card) return;

            if (e.target.closest('.remove-fav')) {
                Favorites.toggle(card.dataset.id);
                renderFavorites();
                cartManager.showMessage('Favorilerden çıkarıldı!', 'info');
                return;
            }

            window.location.href = getProductUrl(card.dataset.id, '../product-detail.html');
        });

        // Navigation
        function goBack() {
            window.location.href = 'user-profile.html';
        }

        function startShopping() {
            window.location.href = '../../index.html';
        }

        // Initialize dark mode
        if (localStorage.getItem('darkMode') === 'true') {
            document.documentElement.classList.add('dark');
        }

        // Back button may restore the page from cache: refresh the list
        window.addEventListener('pageshow', function(e) {
            if (e.persisted) renderFavorites();
        });

        document.addEventListener('DOMContentLoaded', renderFavorites);
    </script>
</body>
</html>
