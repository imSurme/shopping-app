<!DOCTYPE html>
<html class="light" lang="tr">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <meta name="theme-color" content="#008080"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
    <title>Modern Shopping App</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#008080",
                        "primary-dark": "#006666",
                        "background-light": "#FFFFFF",
                        "background-dark": "#101922",
                        "card-background-light": "#F8F9FA",
                        "card-background-dark": "#1a242d",
                        "text-light": "#1F2937",
                        "text-dark": "#F9FAFB",
                        "text-muted-light": "#6B7280",
                        "text-muted-dark": "#9CA3AF",
                        "border-light": "#E5E7EB",
                        "border-dark": "#374151",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.75rem",
                        "lg": "1rem",
                        "xl": "1.25rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'soft': '0 2px 15px -3px rgba(0, 0, 0, 0.07), 0 10px 20px -2px rgba(0, 0, 0, 0.04)',
                        'soft-dark': '0 2px 15px -3px rgba(0, 0, 0, 0.3), 0 10px 20px -2px rgba(0, 0, 0, 0.2)',
                    }
                },
            },
        }
    </script>
    
    <style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
        
        body {
            min-height: 100vh;
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }
        
        /* Touch improvements */
        * {
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        
        /* Loading animation */
        .loading-shimmer {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        
        .dark .loading-shimmer {
            background: linear-gradient(90deg, #374151 25%, #4B5563 50%, #374151 75%);
            background-size: 200% 100%;
        }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        
        /* Product card hover effects */
        .product-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .product-card:active {
            transform: scale(0.98);
        }
        
        /* Category chip animations */
        .category-chip {
            transition: all 0.2s ease-in-out;
        }
        
        .category-chip:active {
            transform: scale(0.95);
        }
        
        /* Search input focus */
        .search-input:focus {
            transform: scale(1.02);
        }
        
        /* Bottom navigation - mobilde sayfanın tam en altına yapışık */
        .nav-item {
            transition: none;
        }
        
        .bottom-nav {
            position: fixed !important;
            bottom: 0 !important;
            left: 0 !important;
            right: 0 !important;
            width: 100% !important;
            padding-bottom: env(safe-area-inset-bottom, 0px);
            box-sizing: border-box;
        }
        
        /* Safe area for mobile devices */
        .safe-area-top {
            padding-top: env(safe-area-inset-top);
        }
        
        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
    <link rel="stylesheet" href="css/desktop.css"/>
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-text-light dark:text-text-dark">
    <div class="app-shell relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden">
        
        <!-- Top App Bar with search -->
        <header class="sticky top-0 z-20 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-md safe-area-top">
            <div class="p-4 pb-2">
                <div class="relative">
                    <button id="searchBtn" class="absolute left-3 top-1/2 -translate-y-1/2 text-primary hover:text-primary-dark transition-colors cursor-pointer z-10">
                        <span class="material-symbols-outlined text-xl">search</span>
                    </button>
                    <input 
                        class="search-input w-full rounded-full border-none bg-card-background-light dark:bg-card-background-dark py-3 pl-12 pr-4 text-text-light dark:text-text-dark placeholder-text-muted-light dark:placeholder-text-muted-dark focus:ring-2 focus:ring-primary focus:outline-none transition-all duration-200 text-base" 
                        placeholder="Ürün ara..." 
                        type="text"
                        autocomplete="off"
                        id="searchInput"
                    />
                </div>
            </div>
        </header>

        <!-- Category Chips - yatay kaydırma, sağda kesilmesin -->
        <section class="pb-1 overflow-hidden">
            <div class="flex gap-3 overflow-x-auto overflow-y-hidden scrollbar-hide pb-1 px-4 min-w-0" style="-webkit-overflow-scrolling: touch;">
                <button class="category-chip flex shrink-0 items-center justify-center gap-x-2 rounded-full bg-primary px-6 py-3 shadow-soft" data-category="tumu">
                    <p class="text-white text-sm font-semibold">Tümü</p>
                </button>
                <button class="category-chip flex shrink-0 items-center justify-center gap-x-2 rounded-full bg-card-background-light dark:bg-card-background-dark px-6 py-3 shadow-soft hover:shadow-soft-dark" data-category="erkek">
                    <span class="material-symbols-outlined text-text-light dark:text-text-dark text-lg">man</span>
                    <p class="text-text-light dark:text-text-dark text-sm font-medium">Erkek</p>
                </button>
                <button class="category-chip flex shrink-0 items-center justify-center gap-x-2 rounded-full bg-card-background-light dark:bg-card-background-dark px-6 py-3 shadow-soft hover:shadow-soft-dark" data-category="kadin">
                    <span class="material-symbols-outlined text-text-light dark:text-text-dark text-lg">woman</span>
                    <p class="text-text-light dark:text-text-dark text-sm font-medium">Kadın</p>
                </button>
                <button class="category-chip flex shrink-0 items-center justify-center gap-x-2 rounded-full bg-card-background-light dark:bg-card-background-dark px-6 py-3 shadow-soft hover:shadow-soft-dark" data-category="cocuk">
                    <span class="material-symbols-outlined text-text-light dark:text-text-dark text-lg">child_care</span>
                    <p class="text-text-light dark:text-text-dark text-sm font-medium">Çocuk</p>
                </button>
                <button class="category-chip flex shrink-0 items-center justify-center gap-x-2 rounded-full bg-card-background-light dark:bg-card-background-dark px-6 py-3 shadow-soft hover:shadow-soft-dark" data-category="ev">
                    <span class="material-symbols-outlined text-text-light dark:text-text-dark text-lg">chair</span>
                    <p class="text-text-light dark:text-text-dark text-sm font-medium">Ev</p>
                </button>
            </div>
        </section>

        <!-- Result count + sort -->
        <section class="px-4 pt-2 pb-3 flex items-center justify-between gap-3">
            <p id="resultCount" class="text-sm text-text-muted-light dark:text-text-muted-dark"></p>
            <label class="flex items-center gap-1 text-sm text-text-light dark:text-text-dark">
                <span class="material-symbols-outlined text-lg text-text-muted-light dark:text-text-muted-dark">swap_vert</span>
                <select id="sortSelect" class="border-none bg-transparent py-1 pl-1 pr-8 text-sm font-medium focus:ring-2 focus:ring-primary rounded-lg">
                    <option value="recommended">Önerilen</option>
                    <option value="price-asc">Fiyat: Artan</option>
                    <option value="price-desc">Fiyat: Azalan</option>
                    <option value="newest">En Yeniler</option>
                    <option value="rating">En Yüksek Puan</option>
                </select>
            </label>
        </section>

        <!-- Product Grid (rendered from js/products.js) -->
        <main class="flex-grow px-4 pb-24">
            <div id="productGrid" class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5"></div>
            <div id="noResults" class="hidden flex flex-col items-center text-center py-16 gap-3">
                <span class="material-symbols-outlined text-6xl text-text-muted-light dark:text-text-muted-dark">search_off</span>
                <p class="text-text-muted-light dark:text-text-muted-dark">Aramanızla eşleşen ürün bulunamadı.</p>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav fixed bottom-0 left-0 right-0 z-20 bg-background-light dark:bg-background-dark border-t border-border-light dark:border-border-dark">
            <div class="flex px-2 py-1">
                <a class="nav-brand text-primary" href="index.html">
                    <span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">shopping_bag</span>
                    Modern Shopping
                </a>
                <a class="nav-item flex flex-1 flex-col items-center justify-center gap-1 text-primary py-2" href="index.html">
                    <span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">home</span>
                    <p class="text-primary text-xs font-semibold">Ana Sayfa</p>
                </a>
                <a class="nav-item flex flex-1 flex-col items-center justify-center gap-1 text-text-muted-light dark:text-text-muted-dark py-2 relative" href="pages/shopping-cart.html">
                    <span class="relative">
                        <span class="material-symbols-outlined text-2xl">shopping_cart</span>
                        <span class="absolute -top-1.5 -right-3 bg-primary text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold cart-badge hidden">0</span>
                    </span>
                    <p class="text-xs font-medium">Sepet</p>
                </a>
                <a class="nav-item flex flex-1 flex-col items-center justify-center gap-1 text-text-muted-light dark:text-text-muted-dark py-2" href="pages/profile/user-profile.html">
                    <span class="material-symbols-outlined text-2xl">person</span>
                    <p class="text-xs font-medium">Profil</p>
                </a>
            </div>
        </nav>

    </div>

    <!-- Products & Cart Manager -->
    <script src="js/products.js"></script>
    <script src="js/cart-manager.js"></script>
    
    <!-- JavaScript for enhanced interactions -->
    <script>
        // Dark mode toggle functionality
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('darkMode', document.documentElement.classList.contains('dark'));
        }

        // Initialize dark mode from localStorage
        if (localStorage.getItem('darkMode') === 'true') {
            document.documentElement.classList.add('dark');
        }

        // Current filter state
        let currentCategory = 'tumu';
        let currentSearchTerm = '';

        let currentSort = 'recommended';

        function sortProducts(products) {
            const sorted = [...products];
            switch (currentSort) {
                case 'price-asc': return sorted.sort((a, b) => a.price - b.price);
                case 'price-desc': return sorted.sort((a, b) => b.price - a.price);
                case 'newest': return sorted.sort((a, b) => b.addedAt.localeCompare(a.addedAt));
                case 'rating': return sorted.sort((a, b) => b.rating - a.rating);
                default: return sorted;
            }
        }

        function renderProductCard(product) {
            const discount = getDiscountPercent(product);
            const isFav = Favorites.has(product.id);
            return `
                <article class="product-card group cursor-pointer" data-id="${product.id}">
                    <div class="relative overflow-hidden rounded-xl bg-card-background-light dark:bg-card-background-dark aspect-[3/4] mb-3 shadow-soft">
                        ${discount ? `<span class="absolute top-3 left-3 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full z-10">%${discount}</span>` : ''}
                        <button class="fav-btn absolute top-2 right-2 z-10 flex size-9 items-center justify-center rounded-full bg-white/80 dark:bg-black/40 backdrop-blur-sm" aria-label="Favorilere ekle">
                            <span class="material-symbols-outlined text-xl ${isFav ? 'text-red-500' : 'text-text-light dark:text-text-dark'}" style="font-variation-settings: 'FILL' ${isFav ? 1 : 0};">favorite</span>
                        </button>
                        <div class="w-full h-full bg-center bg-no-repeat bg-cover transition-transform duration-300 group-hover:scale-105" style='background-image: url("${product.image}");'></div>
                    </div>
                    <div>
                        <h3 class="text-text-light dark:text-text-dark text-sm font-semibold leading-tight mb-1">${product.name}</h3>
                        <div class="flex items-center gap-2">
                            <p class="text-primary text-base font-bold">${formatPrice(product.price)}</p>
                            ${discount ? `<p class="text-text-muted-light dark:text-text-muted-dark text-sm line-through">${formatPrice(product.originalPrice)}</p>` : ''}
                        </div>
                    </div>
                </article>
            `;
        }

        // Filter, sort and render products
        function filterProducts() {
            const matches = PRODUCTS.filter(product => {
                const matchesSearch = currentSearchTerm === '' ||
                    product.name.toLocaleLowerCase('tr').includes(currentSearchTerm) ||
                    product.description.toLocaleLowerCase('tr').includes(currentSearchTerm);
                const matchesCategory = currentCategory === 'tumu' || product.category === currentCategory;
                return matchesSearch && matchesCategory;
            });

            document.getElementById('productGrid').innerHTML = sortProducts(matches).map(renderProductCard).join('');
            document.getElementById('noResults').classList.toggle('hidden', matches.length > 0);
            document.getElementById('resultCount').textContent = `${matches.length} ürün`;
        }

        // Search functionality
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        
        searchInput.addEventListener('input', function(e) {
            currentSearchTerm = e.target.value.toLocaleLowerCase('tr');
            filterProducts();
        });
        
        // Search button click
        searchBtn.addEventListener('click', function() {
            currentSearchTerm = searchInput.value.toLocaleLowerCase('tr');
            filterProducts();
            searchInput.focus();
        });
        
        // Enter key to search
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                currentSearchTerm = this.value.toLocaleLowerCase('tr');
                filterProducts();
            }
        });

        // Category filter functionality
        const categoryChips = document.querySelectorAll('.category-chip');
        categoryChips.forEach(chip => {
            chip.addEventListener('click', function() {
                // Remove active class from all chips
                categoryChips.forEach(c => {
                    c.classList.remove('bg-primary', 'text-white');
                    c.classList.add('bg-card-background-light', 'dark:bg-card-background-dark', 'text-text-light', 'dark:text-text-dark');
                    // Reset text color for p element
                    const pElement = c.querySelector('p');
                    if (pElement) {
                        pElement.classList.remove('text-white');
                        pElement.classList.add('text-text-light', 'dark:text-text-dark');
                    }
                });
                
                // Add active class to clicked chip
                this.classList.add('bg-primary', 'text-white');
                this.classList.remove('bg-card-background-light', 'dark:bg-card-background-dark', 'text-text-light', 'dark:text-text-dark');
                // Set text color for p element
                const pElement = this.querySelector('p');
                if (pElement) {
                    pElement.classList.add('text-white');
                    pElement.classList.remove('text-text-light', 'dark:text-text-dark');
                }
                
                // Update current category and filter
                currentCategory = this.dataset.category;
                filterProducts();
            });
        });

        // Product card interactions
        // Event delegation: cards are re-rendered on every filter/sort
        document.getElementById('productGrid').addEventListener('click', function(e) {
            const card = e.target.closest('.product-card');
            if (!card) return;

            const favButton = e.target.closest('.fav-btn');
            if (favButton) {
                const isFav = Favorites.toggle(card.dataset.id);
                const icon = favButton.querySelector('.material-symbols-outlined');
                icon.style.fontVariationSettings = `'FILL' ${isFav ? 1 : 0}`;
                icon.classList.toggle('text-red-500', isFav);
                icon.classList.toggle('text-text-light', !isFav);
                icon.classList.toggle('dark:text-text-dark', !isFav);
                cartManager.showMessage(isFav ? 'Favorilere eklendi!' : 'Favorilerden çıkarıldı!', isFav ? 'success' : 'info');
                return;
            }

            window.location.href = getProductUrl(card.dataset.id, 'pages/product-detail.html');
        });

        document.getElementById('sortSelect').addEventListener('change', function() {
            currentSort = this.value;
            filterProducts();
        });

        filterProducts();


        // Smooth scroll for better mobile experience
        document.documentElement.style.scrollBehavior = 'smooth';

        // Prevent zoom on double tap for iOS
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        // Back button may restore the page from cache: refresh favorites and badge
        window.addEventListener('pageshow', function(e) {
            if (e.persisted) {
                filterProducts();
                cartManager.updateCartBadge();
            }
        });
    </script>
</body>
</html>
